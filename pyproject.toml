[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent-security"
version = "0.1.0"
description = "Hackathon prototype of the Aegis agent security control plane"
requires-python = ">=3.11"

[project.scripts]
aegis-demo = "aegis.demo:main"
aegis-dashboard = "aegis.webapp:main"
aegis-eval = "aegis.eval:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
